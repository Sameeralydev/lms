name: TechMentors centralized testing quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate and install PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          cp .env.example .env
          php artisan key:generate
          cp .env.testing.example .env.testing
          APP_KEY="$(php artisan key:generate --show)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.testing
          git check-ignore --quiet .env.testing

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          composer audit --locked
          npm audit --audit-level=low

      - name: Format, type, and lint checks
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
          composer format:check
          composer analyse
          npm run format:check
          npm run typecheck
          npm run lint

      - name: Unit and feature tests
        run: |
          export TESTING_PROFILE=sqlite
          npm run test:unit
          php tests/run-tests.php --sqlite

      - name: Build and browser checks
        env:
          APP_URL: http://127.0.0.1:8017
          MAIL_MAILER: array
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
